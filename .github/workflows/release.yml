name: Release

# Pull requests and manual runs build all three platforms and keep the
# installers as workflow artifacts. A pushed tag `v*` also publishes them
# as a GitHub Release.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUCE_VERSION: 6.3.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            package: --formats clap,vst3,au2 --no-sign --no-notarize --host-only
          - name: Windows (x64)
            os: windows-latest
            package: --formats clap,vst3 --no-sign --host-only
          - name: Linux (x64)
            os: ubuntu-22.04
            package: --formats clap,vst3
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libjack-jackd2-dev libudev-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-truce
        run: cargo install cargo-truce --version ${{ env.TRUCE_VERSION }} --locked

      - name: Test
        run: cargo test --release --lib --no-default-features --features clap

      - name: Package
        run: cargo truce package ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: youth106-${{ runner.os }}
          path: target/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Youth106 ${GITHUB_REF_NAME#v}" --generate-notes
